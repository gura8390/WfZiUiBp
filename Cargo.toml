[package]
name = "wf-zi-ui-bp"
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
description = "离线截图、图片及文档文字识别"

[dependencies]
anyhow = "1"
arboard = { version = "3.6", features = ["image-data"] }
base64 = "0.22"
eframe = { version = "0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
encoding_rs = "0.8"
futures-executor = "0.3"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "tiff", "webp"] }
lopdf = { version = "0.38", default-features = false }
mobi = "0.8"
multer = "3"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["load-dynamic", "api-24"] }
quick-xml = { version = "0.38", features = ["escape-html"] }
raw-window-handle = "0.6"
rfd = { version = "0.15", default-features = false }
roxmltree = "0.21"
rxing = { version = "0.9.3", default-features = false, features = ["image", "encoding_rs", "encoders", "decoders", "full_barcode_format_support", "multi_barcode_readers"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
tempfile = "3"
ttf-parser = "0.25"
windows = { version = "0.62.2", features = ["Data_Pdf", "Foundation", "Storage", "Storage_Streams", "Win32_Graphics_Imaging", "Win32_Graphics_Printing", "Win32_Storage_Xps", "Win32_System_Com", "Win32_System_WinRT"] }
windows-future = "0.3.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
